[project]
name = "contoso-agents"
version = "0.1.0"
description = "Customer-facing showcase of Microsoft Agent Framework 1.x: agents, tools, approvals, middleware, handoff and concurrent orchestration, Harness, MCP, checkpoints, observability and DevUI."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "agent-framework>=1.18.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[project.scripts]
contoso-agents = "contoso_agents.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["contoso_agents"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]
